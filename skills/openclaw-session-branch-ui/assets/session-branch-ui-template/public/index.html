<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Branch UI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="layout" class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-header-main">
            <button id="sidebar-close" class="ghost sidebar-toggle sidebar-close" type="button" aria-label="隐藏导航栏">☰</button>
            <h1>Session Branch UI</h1>
          </div>
          <button id="refresh-all" class="ghost">刷新</button>
        </div>

        <section class="panel">
          <div class="panel-title-row">
            <h2>命名分支</h2>
          </div>
          <form id="create-branch-form" class="create-form">
            <input id="branch-name" name="branchName" type="text" placeholder="比如：写作分支 / 调研分支" autocomplete="off" />
            <button type="submit">新建</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-title-row">
            <h2>现有会话</h2>
          </div>
          <input id="session-search" type="search" class="session-search-input" placeholder="搜索会话名…" autocomplete="off" />
          <div id="sessions-list" class="list"></div>
        </section>

      </aside>

      <main class="main">
        <header class="chat-header">
          <div class="chat-title-shell">
            <button id="sidebar-open" class="ghost sidebar-toggle sidebar-open" type="button" aria-label="显示导航栏">☰</button>
            <div>
              <div class="eyebrow">当前分支</div>
              <div id="active-title" class="active-title">未选择</div>
              <div id="active-key" class="active-key"></div>
            </div>
          </div>
          <div class="header-actions">
            <div class="search-shell">
              <div class="search-input-row">
                <input id="message-search" type="search" placeholder="搜索时间戳 / 关键词" autocomplete="off" disabled />
                <div id="message-search-summary" class="search-summary"></div>
              </div>
              <div id="message-search-results" class="search-results" hidden></div>
            </div>
            <button id="rename-branch" class="ghost">重命名</button>
            <button id="delete-branch" class="danger ghost">删除分支</button>
          </div>
        </header>

        <section class="messages-shell">
          <div id="history-loading-banner" class="history-toast" hidden></div>
          <section id="messages" class="messages"></section>
        </section>

        <div id="message-context-menu" class="context-menu" hidden>
          <button id="context-delete-before" class="context-menu-item danger" type="button">删除此条及之前</button>
        </div>

        <footer class="composer">
          <textarea id="composer-input" rows="4" placeholder="给当前分支发消息。第一次发消息时，这个自定义 sessionKey 就会真正开始写入历史。"></textarea>
          <div class="composer-actions">
            <div id="status" class="status">准备就绪</div>
            <button id="send-button">发送</button>
          </div>
        </footer>
      </main>
    </div>

    <template id="item-template">
      <button class="list-item" type="button">
        <div class="list-item-title"></div>
        <div class="list-item-meta"></div>
      </button>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
